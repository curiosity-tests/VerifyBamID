name: CI
run-name: "CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
    branches:
    - main
    - develop
  pull_request:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  issue_comment:
    types: [created, edited]


permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  build:
    if: |
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && (
        contains(github.event.comment.body, 'retest') ||
        contains(github.event.comment.body, 'Retest') ||
        contains(github.event.comment.body, 'jenkins') ||
        contains(github.event.comment.body, 'Jenkins')
      ))

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        compiler: [gcc-9, gcc, clang]
    runs-on: ${{ matrix.os }}
    name: Build on ${{ matrix.os }} with ${{ matrix.compiler }}

    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
        fetch-depth: 0
    - name: Set compiler environment variables
      id: compiler
      run: |
        case "${{ matrix.compiler }}" in
          gcc-9)
            echo "CC=gcc-9" >> $GITHUB_ENV
            echo "CXX=g++-9" >> $GITHUB_ENV
            echo "compiler-name=gcc9" >> $GITHUB_OUTPUT
            ;;
          gcc)
            echo "CC=gcc" >> $GITHUB_ENV
            echo "CXX=g++" >> $GITHUB_ENV
            echo "compiler-name=gcc-latest" >> $GITHUB_OUTPUT
            ;;
          clang)
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
            echo "compiler-name=clang" >> $GITHUB_OUTPUT
            ;;
        esac

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        APT_GET="apt-get"
        if command -v sudo >/dev/null 2>&1; then
          APT_GET="sudo apt-get"
        fi
        $APT_GET update
        $APT_GET install -y \
          cmake \
          g++ \
          gcc-9 \
          g++-9 \
          clang \
          libbz2-dev \
          libcurl4-openssl-dev \
          zlib1g-dev \
          liblzma-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install \
          cmake \
          gcc \
          llvm \
          bzip2 \
          curl \
          xz

    - name: Get commit hash
      id: commit
      run: |
        COMMIT_HASH=$(git rev-parse --short=6 HEAD)
        echo "short-sha=${COMMIT_HASH}" >> $GITHUB_OUTPUT

    - name: Cache htslib
      id: cache-htslib
      uses: actions/cache@v4
      with:
        path: |
          /usr/local/lib/libhts*
          /usr/local/include/htslib
        key: htslib-1.11-${{ runner.os }}

    - name: Download and build htslib
      if: steps.cache-htslib.outputs.cache-hit != 'true'
      run: |
        cd /tmp
        wget -q https://github.com/samtools/htslib/releases/download/1.11/htslib-1.11.tar.bz2
        tar -xf htslib-1.11.tar.bz2
        cd htslib-1.11
        ./configure --prefix=/usr/local
        make -j"$(nproc || sysctl -n hw.ncpu || echo 2)"
        if command -v sudo >/dev/null 2>&1; then
          sudo make install
        else
          make install
        fi

    - name: Create build directory
      run: mkdir -p build

    - name: Configure CMake
      run: |
        cd build
        cmake \
          -DCMAKE_C_COMPILER=${{ env.CC }} \
          -DCMAKE_CXX_COMPILER=${{ env.CXX }} \
          ..

    - name: Build
      run: |
        cd build
        make

    - name: Run tests
      run: |
        cd build
        make test

    - name: Prepare artifacts
      if: success()
      run: |
        mkdir -p artifacts
        cp bin/VerifyBamID artifacts/ || true
        cp -r build/Testing artifacts/test-results || true

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: VerifyBamID-${{ runner.os }}-${{ steps.compiler.outputs.compiler-name }}-${{ steps.commit.outputs.short-sha }}-${{ github.run_number }}
        path: artifacts/
        retention-days: 30

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  test-summary:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
    - name: Check build status
      run: |
        result="${{ needs.build.result }}"
        if [ "$result" == "failure" ]; then
          echo "❌ Some builds failed"
          exit 1
        elif [ "$result" == "cancelled" ]; then
          echo "⚠️ Build was cancelled"
          exit 1
        else
          echo "✅ All builds passed or skipped!"
          exit 0
        fi
